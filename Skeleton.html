<!doctype html>
<html lang="en">

    <head>
        <title>Skeleton</title>
        <meta name="Skeleton" content="#" />

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Other libraries go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <button type="button" class="bg-transparent border-0 p-3" aria-label="back">
            <img src="/images/arrow-left.svg" width="40" height="40" alt="">
        </button>
    
        <main>
            <h1 class="d-flex justify-content-center py-3">
                Step #
            </h1>
            <div class="d-block text-center">
                <figure class="figure d-block mx-auto bg-secondary-subtle border border-secondary-subtle rounded p-3"
                    style="max-width: 600px;">
                    <img src="/images/hike2.jpg" class="figure-img w-100 rounded object-fit-cover" style="aspect-ratio: 3 / 2;"
                        alt="Describe the hike photo here">
                    <figcaption class="figure-caption">A caption for the above image.</figcaption>
                </figure>
                
                <div class="mx-auto border-3 pb-4  bg-info-subtle rounded py-3" style="max-width: 600px;">
                    <ol class="mx-auto" style="max-width: 600px;">
                        <li class="mb-2" style="max-width: fit-content;">Put your first step here.</li>
                        <li class="mb-2" style="max-width: fit-content;">Put your second step here.</li>
                        <li class="mb-2" style="max-width: fit-content;">Put your third step here.</li>
                    </ol>

                
                    <container class="d-flex flex-wrap justify-content-end py-3 px-4">
                        <a href="#" class="btn btn-solid btn-styled btn-lg rounded-pill bg-light-subtle border border-secondary-subtle">← Go back</a>
                        <a href="#" class="btn btn-solid btn-styled btn-lg rounded-pill bg-light-subtle border border-secondary-subtle">Next step →</a>

                    </container>


                </div>
            </div>
        </main>

        <site-footer></site-footer>

        <!-- Link to scripts of your own -->
        <script type="module" src="/src/components/site-footer.js"></script>
    </body>

</html>
