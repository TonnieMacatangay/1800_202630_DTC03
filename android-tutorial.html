<!doctype html>
<html lang="en">
  <head>
    <title>Google Play Store Tutorial</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container pt-4">
      <a href="android-options.html" class="btn btn-outline-secondary mb-4">
        ← Back
      </a>
    </div>

    <main class="container text-center pb-5 mb-5">
      <h1 id="step-heading" class="py-3">Step 1</h1>

      <h2 id="tutorial-title" class="fs-4 mb-4">Install an App</h2>
      <button
        id="favourite-btn"
        type="button"
        class="btn btn-outline-danger my-3"
        disabled
      >
        ♡ Add to Favourites
      </button>

      <figure
        class="figure d-block mx-auto bg-secondary-subtle border rounded p-3"
        style="max-width: 600px"
      >
        <img
          id="step-image"
          src=""
          class="figure-img w-100 rounded"
          alt="Android tutorial screenshot"
          hidden
        />

        <div
          id="image-placeholder"
          class="bg-light rounded d-flex align-items-center justify-content-center"
          style="aspect-ratio: 3 / 2"
        >
          Android screenshot goes here
        </div>

        <figcaption id="step-caption" class="figure-caption mt-2">
          Google Play Store instructions
        </figcaption>
      </figure>

      <section
        class="mx-auto bg-info-subtle rounded p-4"
        style="max-width: 600px"
      >
        <p id="step-instruction" class="fs-5">
          Open Google Play Store on your Android phone.
        </p>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button id="previous-step" class="btn btn-light rounded-pill">
            ← Go back
          </button>

          <button id="next-step" class="btn btn-light rounded-pill">
            Next step →
          </button>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/components/site-footer.js"></script>
    <script type="module" src="./src/androidTutorial.js"></script>
  </body>
</html>
