<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Bottom Navbar / Footer -->
    <!-- fixed-bottom class will force this to the bottom of the page -->
    <!-- container-fluid with column will space these out evenly -->
    <nav
      class="navbar bg-body-tertiary fixed-bottom container-fluid column p-4"
    >
      <button type="button" class="btn-icon" aria-label="Home">
        <svg class="bi" width="25" height="25" fill="currentColor" aria-hidden="true">
          <use href="images\home_icon.svg"></use>
        </svg>
      </button>

      <button type="button" class="btn-icon" aria-label="Search">
        <svg class="bi" width="25" height="25" fill="currentColor" aria-hidden="true">
          <use href="images\search_icon.svg"></use>
        </svg>
      </button>

      <button type="button" class="btn-icon" aria-label="Message">
        <svg class="bi" width="25" height="25" fill="currentColor" aria-hidden="true">
          <use href="images\message-text_icon.svg"></use>
        </svg>
      </button>

      <button type="button" class="btn-icon" aria-label="Profile"(onclick="window.location.href = 'login.html'")>
        <svg class="bi" width="25" height="25" fill="currentColor" aria-hidden="true">
          <use href="images\profile-circle_icon.svg"></use>
        </svg>
      </button>

    </nav>

    <!-- Just some big buttons -->
    <!-- We want it centered, which d-flex and justify-content-center will do for us -->
    <main>
      <h1 class="d-flex justify-content-center p-5">
        What do you need help with?
      </h1>
      <div
        class="mx-auto p-2 d-flex justify-content-center"
        style="width: auto"
      >
        <button
          class="container-fluid w-50 btn btn-primary btn-lg mx-auto"
          type="button"
        >
          Communication Apps
        </button>
      </div>
      <div
        class="mx-auto p-2 d-flex justify-content-center"
        style="width: auto"
      >
        <button
          class="container-fluid w-50 btn btn-primary btn-lg mx-auto"
          type="button"
        >
          Navigation Apps
        </button>
      </div>
      <div
        class="mx-auto p-2 d-flex justify-content-center"
        style="width: auto"
      >
        <button
          class="container-fluid w-50 btn btn-primary btn-lg mx-auto"
          type="button"
        >
          Others (Type Here)
        </button>
      </div>
    </main>
