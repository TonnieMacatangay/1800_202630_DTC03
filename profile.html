<!doctype html>
<html lang="en">
  <head>
    <title>My Profile</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <site-navbar></site-navbar>
    <main class="container py-4" style="padding-bottom: 120px !important">
      <h1 class="text-center mb-4">My Profile</h1>

      <section class="card p-4 mx-auto" style="max-width: 600px">
        <!-- User header -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div
            id="avatar"
            class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
            style="width: 60px; height: 60px; font-size: 24px"
          ></div>

          <div>
            <h2 id="profileName" class="h4 mb-1"></h2>
            <p id="profileEmail" class="text-muted mb-0"></p>
          </div>
        </div>

        <h2 class="h4 mb-4">Personal Information</h2>

        <form id="profileForm">
          <div class="mb-3">
            <label for="nameInput" class="form-label">Name</label>
            <input type="text" id="nameInput" class="form-control" disabled />
          </div>

          <div class="mb-3">
            <label for="countryInput" class="form-label">Country</label>
            <input
              type="text"
              id="countryInput"
              class="form-control"
              disabled
            />
          </div>

          <div class="mb-3">
            <label for="schoolInput" class="form-label">School</label>
            <input type="text" id="schoolInput" class="form-control" disabled />
          </div>

          <div class="mb-3">
            <label for="bioInput" class="form-label">Bio</label>
            <textarea
              id="bioInput"
              class="form-control"
              rows="3"
              disabled
            ></textarea>
          </div>

          <button type="button" id="editBtn" class="btn btn-primary">
            Edit Profile
          </button>

          <button type="submit" id="saveBtn" class="btn btn-success" disabled>
            Save Changes
          </button>

          <div id="profileAlert" class="alert alert-success d-none mt-3"></div>
        </form>
      </section>

      <!-- Favourite tutorials -->
      <section class="mx-auto mt-4" style="max-width: 600px">
        <h2 class="h4 mb-3">My Favourite Tutorials</h2>

        <div id="favourites-container" class="d-grid gap-3">
          <p class="text-muted">Your favourite tutorials will appear here.</p>
        </div>

        <template id="favouriteCardTemplate">
          <a id="favourite-link" href="#" class="card h-100 text-decoration-none">
            <div class="ratio ratio-16x9 bg-body-secondary rounded-top">
              <img id="favourite-image" src="" class="w-100 h-100 object-fit-contain rounded-top" alt="" />
            </div>
            <div>
              <h2 id="favourite-title" class="h4 px-2 pt-2"></h2>
              <p id="favourite-description" class="text-body-secondary px-2"></p>
              <span class="btn mx-2 mb-3"
                style="--bs-btn-bg:#024a56; --bs-btn-border-color:#024a56; --bs-btn-color:#fff; --bs-btn-hover-bg:#4d998f; --bs-btn-hover-border-color:#4d998f; --bs-btn-hover-color:#fff;">Get
                Started</span>
            </div>
          </a>
        </template>
      
      </section>
      <!-- Log out button -->
      <div class="text-center mt-4">
        <button type="button" id="logoutBtn" class="btn btn-outline-danger">
          Log out
        </button>
      </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/components/site-footer.js"></script>
    <script type="module" src="./src/profile.js"></script>
    <script type="module" src="./src/components/site-navbar.js"></script>
  </body>
</html>
