<!doctype html>
<html lang="en">
  <head>
    <title>My Profile</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="container py-4" style="padding-bottom: 120px !important">
      <h1 class="text-center mb-4">My Profile</h1>

      <section class="card p-4 mx-auto" style="max-width: 600px">
        <!-- User header -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div
            id="avatar"
            class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
            style="width: 60px; height: 60px; font-size: 24px"
          ></div>

          <div>
            <h2 id="profileName" class="h4 mb-1"></h2>
            <p id="profileEmail" class="text-muted mb-0"></p>
          </div>
        </div>

        <h2 class="h4 mb-4">Personal Information</h2>

        <form id="profileForm">
          <div class="mb-3">
            <label for="nameInput" class="form-label">Name</label>
            <input type="text" id="nameInput" class="form-control" disabled />
          </div>

          <div class="mb-3">
            <label for="countryInput" class="form-label">Country</label>
            <input
              type="text"
              id="countryInput"
              class="form-control"
              disabled
            />
          </div>

          <div class="mb-3">
            <label for="schoolInput" class="form-label">School</label>
            <input type="text" id="schoolInput" class="form-control" disabled />
          </div>

          <div class="mb-3">
            <label for="bioInput" class="form-label">Bio</label>
            <textarea
              id="bioInput"
              class="form-control"
              rows="3"
              disabled
            ></textarea>
          </div>

          <button type="button" id="editBtn" class="btn btn-primary">
            Edit Profile
          </button>

          <button type="submit" id="saveBtn" class="btn btn-success" disabled>
            Save Changes
          </button>

          <div id="profileAlert" class="alert alert-success d-none mt-3"></div>
        </form>
      </section>

      <!-- Favourite tutorials -->
      <section class="mx-auto mt-4" style="max-width: 600px">
        <h2 class="h4 mb-3">My Favourite Tutorials</h2>

        <div id="favourites-container">
          <p class="text-muted">Your favourite tutorials will appear here.</p>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/components/site-footer.js"></script>
    <script type="module" src="./src/profile.js"></script>
  </body>
</html>
