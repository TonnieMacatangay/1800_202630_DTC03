<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <site-navbar></site-navbar>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Bottom Navbar / Footer -->
    <!-- fixed-bottom class will force this to the bottom of the page -->
    <!-- container-fluid with column will space these out evenly -->
    <!-- Just some big buttons -->
    <!-- We want it centered, which d-flex and justify-content-center will do for us -->
    <main>
      <h1 class="d-flex justify-content-center p-2">
        Hello,
        <span id="name-goes-here" class="mx-2"> friend! </span>
      </h1>

      <h1 class="d-flex justify-content-center pb-5">
        What do you need help with?
      </h1>

      <div class="container">
        <template id="cards-go-here" class="row row-cols-1 row-cols-md-2 g-4">
          <div id="cardTemplate" class="col">
            <a id="card-link"
              href="apps.html?category=Communication-Apps"
              class="card h-100 text-decoration-none"
            >
            <div class="ratio ratio-16x9 bg-body-secondary rounded-top">
              <img 
                id="card-image"
                src="/images/communication-apps.png"
                class="w-100 h-100 object-fit-contain rounded-top"
                alt=""
              />
            </div>

            <div>
              <h2 id="card-title" class="h4 px-2">Communication Apps</h2>
              <p id="card-description" class="text-body-secondary px-2">
                Send messages, make video calls and share photos with apps
                like WhatsApp.
              </p>
              <span class="btn mx-2 mb-3"
                style="--bs-btn-bg:#024a56; --bs-btn-border-color:#024a56; --bs-btn-color:#fff; --bs-btn-hover-bg:#4d998f; --bs-btn-hover-border-color:#4d998f; --bs-btn-hover-color:#fff;">Get
                Started</span>
            </div>
            </a>
          </div>
        </template>
      </div>
    </main>

    <site-footer></site-footer>
    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="/src/components/site-footer.js"></script>
    <script type="module" src="./src/components/site-navbar.js"></script>
    <script type="module" src="./src/search-results.js"></script>
  </body>
</html>
