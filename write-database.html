<!DOCTYPE html>
<html lang="en">

<head>
    <title>Write to Database</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
    <main class="container py-4" style="max-width: 720px;">

        <!-- Header: avatar + name + email - NOTE, I've commented this section out. Can uncomment if we want.
        <div class="d-flex align-items-center gap-3 mb-4">
            <div id="avatar" class="rounded-circle bg-warning fw-bold fs-3 d-flex align-items-center justify-content-center"
                 style="width: 64px; height: 64px;">?</div>
            <div>
                <h1 id="profileName" class="h3 mb-0">My profile</h1>
                <small id="profileEmail" class="text-muted"></small>
            </div>
        </div> -->

        <!-- Section 1: Write to Database Form -->
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h2 class="h5 card-title mb-3"><i class="bi bi-person-fill me-1"></i>Write to Database</h2>
                <div id="writeAlert" class="alert alert-success d-none" role="alert"></div>

                <form id="databaseForm" novalidate>
                    <div id="appNameInput1" class="mb-3">
                        <label for="appName" class="form-label">Name of App</label>
                        <input type="text" id="appName" class="form-control" disabled />
                    </div>
                    <div id="appCategoryInput1" class="mb-3">
                        <label for="appCategory" class="form-label">Category of App</label>
                        <input type="text" id="appCategory" class="form-control" disabled />
                    </div>
                    <!-- Note: Store option name with the step fields -->
                    <div id="appOptionInput1" class="mb-3">
                        <label for="appCategory" class="form-label">Option of App</label>
                        <input type="text" id="appCategory" class="form-control" disabled />
                    </div>
                    <button type="button" id="addOptionBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Add Another Option
                    </button>

                    <h2 class="">Steps</h2>
                    <div id="stepInputFields1" class="mb-3">
                        <div id="stepTitleInput" class="mb-3">
                            <label for="stepTitle" class="form-label">Step Title</label>
                            <input type="text" id="stepTitle" class="form-control" disabled />
                        </div>
                        <div id="stepDescriptionInput" class="mb-3">
                            <label for="stepDescription" class="form-label">Step Description</label>
                            <input type="text" id="stepDescription" class="form-control" disabled />
                        </div>
                        <div id="stepImageInput" class="mb-3">
                            <label for="stepImage" class="form-label">Step Image Path</label>
                            <input type="text" id="stepImage" class="form-control" disabled />
                        </div>
                    </div>
                    <!-- NOTE: Add Another Step button should not add another Step Title -->
                    <button type="button" id="addOptionBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Add Another Step
                    </button>
                    <!-- Just to set aside on new line -->
                    <div></div>

                    <button type="button" id="editBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                </form>
            </div>
        </div>

    </main>
    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <!-- <script type="module" src="/src/write-database.js"></script> uncomment when fixed -->

</body>

</html>
